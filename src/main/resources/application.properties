spring.application.name=fuel-community-api

# Configuración para Docker Local / MariaDB Local
spring.datasource.url=jdbc:mariadb://localhost:3306/fuel_db
spring.datasource.username=root
spring.datasource.password=secret
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuración de Hibernate/JPA para que cree las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Puerto donde correrá tu API de Spring Boot
server.port=8080

# Una clave secreta larga y aleatoria (cámbiala por una tuya en producción)
jwt.secret=miSecretKeySuperSecuraParaQueNadieLaPuedaAdivinar1234567891
jwt.expiration=86400000